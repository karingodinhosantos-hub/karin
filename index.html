<!DOCTYPE html>
<html lang="en">
    <head
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>minecraft</title>
        <style>
            header{
                background-color: #2641da;
                color: #000000;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }
            main {
                background-color: #ffffff;
                color: #000000;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }
            article{
                display: flex;

            }
            img{
                width: 80px;
                height: 80px;
            }
            .artigo-autor{
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
        <h1> Minha pagina sobre jogo</h1>
        <p> Vou compartilhar conhecimentos sobre minecraft.</p>
        </header>
        <main>
            <article> 
                <img src="Gemini_Generated_Image_.png" 
                    alt="Logotipo redondo para a página minecraft com fundo em estilo grafite urbano nas cores azul e preto. No centro,
                    destaca-se um minecraft preto com detalhes em degradê azul. Na parte superior, está 
                    escrito o minecraft. À direita, aparece o logotipo quadrado clássico do jogo.">
                <div>
                    <h2>Meu primeiro post</h2>
                    <p class="artigo-autor">Por:karin </p>
                    <p> Boas-vindos ao meu vlog sobre minecraft.</p>
                    <button>👍 <span>0</span></button>
                    <button>❤️ <span>0</span></button>
                <div>
            </article>
            <article> 
                <img src="Gemini_Generated_Image_.png" 
                    alt="Logotipo redondo para a página minecraft com fundo em estilo grafite urbano nas cores azul e preto. No centro,
                    destaca-se um minecraft preto com detalhes em degradê azul. Na parte superior, está 
                    escrito o minecraft. À direita, aparece o logotipo quadrado clássico do jogo.">
                <div>
                    <h2>Meu segundo post</h2>
                    <p class="artigo-autor">Por:karin </p>
                    <p> Boas-vindos ao meu vlog sobre minecraft.</p>
                    <button>👍 <span>0</span></button>
                    <button>❤️ <span>0</span></button>
                <div>
            </article>       
        </main>
    </body>
    <script>
        const botoes = document.querySelectorAll
        ("button");
        
        botoes.forEach(function (botao){
            let curtiu = false;
            botao.addEventListener("click",botaoClicado);
            function botaoClicado(){
                console.log("fui clicado");
                let texto =  botao.querySelector("span");
                if(curtiu === false){
                    texto.textContent++;
                    curtiu = true;
                }else{
                  texto.textContent--;  
                  curtiu = false;
                }

        }

        })

    </script>
</html>
